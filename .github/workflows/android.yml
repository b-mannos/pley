name: Android

# The Android app for phones, tablets, Android TV and Fire TV: one release
# unit (docs/RELEASING.md). Runs when it changes. The Release workflow calls
# it with `release: true`, which adds the signed APK and Play bundle.
on:
  push:
    branches: [master]
    paths:
      - apps/android/**
      - scripts/check-android.ps1
      - .github/workflows/android.yml
      - "!**/CHANGELOG.md"
  pull_request:
    paths:
      - apps/android/**
      - scripts/check-android.ps1
      - .github/workflows/android.yml
      - "!**/CHANGELOG.md"
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Build the release's files too
        type: boolean
        default: false
      version:
        description: The version released (its manifests')
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      signed:
        description: '"true" when the release key was there and the app was built'
        value: ${{ jobs.release.outputs.signed }}

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running checks; master runs them all.
  group: ${{ inputs.release && 'android-release' || format('android-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commits.
jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Its version, which its CHANGELOG has (scripts/version.mjs).
      - name: Version
        working-directory: .
        run: bun scripts/version.mjs check android
      # The wrapper jar is the one Gradle publishes.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      # Every module's unit tests and lint, the debug app, and the store
      # release through R8 (minified and shrunk, unsigned).
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleStoreRelease --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pley-android-debug
          path: apps/android/app/build/outputs/apk/store/debug/app-store-debug.apk
          if-no-files-found: error
          retention-days: 14
      # R8's mapping turns the release's stack traces back into names.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pley-android-release
          path: |
            apps/android/app/build/outputs/apk/store/release/app-store-release-unsigned.apk
            apps/android/app/build/outputs/mapping/storeRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14
      # Allowed libraries only (no FFmpeg, mpv or GPL code), no native code
      # but AndroidX's own, and the APK's size, which goes to the job summary.
      - name: Licences, native code and size of the release
        shell: pwsh
        run: ../../scripts/check-android.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pley-android-reports
          path: apps/android/**/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---- Release (called by release.yml) ---------------------------------------

  # The APK to sideload and the bundle for Google Play, signed with the release
  # key from the repository's secrets (docs/ANDROID.md, Releases). Without the
  # key they are left out, with a warning: unsigned APKs don't install.
  release:
    name: Signed APK and bundle
    if: inputs.release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Release key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: this release has no APK or Play bundle"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "PLEY_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.key.outputs.signed == 'true'
        env:
          PLEY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLEY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLEY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          ./gradlew :app:assembleDirectRelease :app:bundleStoreRelease --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/direct/release/app-direct-release.apk "$GITHUB_WORKSPACE/dist/pley-android-$VERSION.apk"
          cp app/build/outputs/bundle/storeRelease/app-store-release.aab "$GITHUB_WORKSPACE/dist/pley-android-$VERSION-play.aab"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.key.outputs.signed == 'true'
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
