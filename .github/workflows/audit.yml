name: Audit

# Known vulnerabilities in dependencies: whenever the lock files (or the
# Android app's build files) change, and weekly, since advisories are
# published for versions already in use.
on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - deny.toml
      - package-lock.json
      - apps/android/**/*.gradle.kts
      - apps/android/gradle/libs.versions.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - package-lock.json
      - apps/android/**/*.gradle.kts
      - apps/android/gradle/libs.versions.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust crates (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  npm:
    name: npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads package-lock.json only: nothing is installed.
      - run: npm audit --audit-level=moderate

  gradle:
    name: Android libraries (dependency graph)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The resolved Gradle dependencies go to GitHub's dependency graph, where
    # Dependabot alerts on the advisories that concern them.
    permissions:
      contents: write
    # Pull requests from forks get a read-only token, which can't submit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: apps/android
