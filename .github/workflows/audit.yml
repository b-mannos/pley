name: Audit

# Known vulnerabilities in dependencies: whenever the lock files change,
# and weekly, since advisories are published for versions already in use.
on:
  push:
    branches: [master]
    paths:
      - Cargo.lock
      - deny.toml
      - package-lock.json
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      - package-lock.json
      - .github/workflows/audit.yml
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust crates (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  js:
    name: JavaScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Asks the registry about bun.lock's packages: nothing is installed.
      - run: bun audit --audit-level=moderate

