name: Release
run-name: Release ${{ inputs.unit }}${{ inputs.draft && ' (draft)' || '' }}

# Releases one unit, by hand (docs/RELEASING.md): Actions -> Release -> Run
# workflow, on master, with the unit chosen. First `bun scripts/release.mjs
# <unit> <patch|minor|major>` sets its version and dates its CHANGELOG, and
# that commit is pushed. This run then checks the unit's manifests agree,
# refuses when the tag <unit>-v<version> exists, runs the unit's workflow
# with its release builds, tags the commit, and publishes a GitHub release
# whose notes are the version's CHANGELOG section, with checksums and build
# provenance. A server release also pushes the Docker image.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: What to release
        type: choice
        required: true
        options: [server, desktop, android, samsung, lg, kodi, roku]
      draft:
        description: Keep the GitHub release a draft (the tag is made either way)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.unit }}
  cancel-in-progress: false

# Actions are pinned to commits.
jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.info.outputs.version }}
      tag: ${{ steps.info.outputs.tag }}
      title: ${{ steps.info.outputs.title }}
    steps:
      - name: On the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are made from $DEFAULT_BRANCH; this run is on $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: The unit's version
        id: info
        env:
          UNIT: ${{ inputs.unit }}
        run: |
          bun scripts/version.mjs check "$UNIT"
          info=$(bun scripts/version.mjs info "$UNIT")
          {
            echo "version=$(jq -r .version <<< "$info")"
            echo "tag=$(jq -r .tag <<< "$info")"
            echo "title=$(jq -r .title <<< "$info")"
          } >> "$GITHUB_OUTPUT"
      - name: A new tag
        env:
          GH_TOKEN: ${{ github.token }}
          UNIT: ${{ inputs.unit }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "map(select(.ref == \"refs/tags/$TAG\")) | length")
          if [ "$found" != 0 ]; then
            echo "::error::$TAG exists already. Bump $UNIT first: bun scripts/release.mjs $UNIT <patch|minor|major>, then commit and push."
            exit 1
          fi
      - name: The version's notes
        env:
          UNIT: ${{ inputs.unit }}
          VERSION: ${{ steps.info.outputs.version }}
          TAG: ${{ steps.info.outputs.tag }}
          TITLE: ${{ steps.info.outputs.title }}
        run: |
          bun scripts/release.mjs "$UNIT" notes "$VERSION" > notes.md
          {
            echo "## $TITLE $VERSION"
            echo
            echo "Tag \`$TAG\` on $GITHUB_SHA."
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  # The unit's own workflow, with its release builds: each uploads the files
  # for the release as release-* artifacts. Only the unit chosen runs.
  server:
    name: Server
    needs: prepare
    if: inputs.unit == 'server'
    uses: ./.github/workflows/server.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}
    permissions:
      contents: read
      packages: write # the Docker image

  desktop:
    name: Desktop
    needs: prepare
    if: inputs.unit == 'desktop'
    uses: ./.github/workflows/desktop.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}

  android:
    name: Android
    needs: prepare
    if: inputs.unit == 'android'
    uses: ./.github/workflows/android.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  samsung:
    name: Samsung TV
    needs: prepare
    if: inputs.unit == 'samsung'
    uses: ./.github/workflows/samsung.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}

  lg:
    name: LG TV
    needs: prepare
    if: inputs.unit == 'lg'
    uses: ./.github/workflows/lg.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}

  kodi:
    name: Kodi
    needs: prepare
    if: inputs.unit == 'kodi'
    uses: ./.github/workflows/kodi.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}

  roku:
    name: Roku
    needs: prepare
    if: inputs.unit == 'roku'
    uses: ./.github/workflows/roku.yml
    with:
      release: true
      version: ${{ needs.prepare.outputs.version }}

  # Builds nothing: the jobs above build each file without the right to
  # write the release, and this one only checksums, attests, tags and
  # publishes.
  publish:
    name: Publish
    needs: [prepare, server, desktop, android, samsung, lg, kodi, roku]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs[inputs.unit].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # make the tag and the release
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UNIT: ${{ inputs.unit }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      TITLE: ${{ needs.prepare.outputs.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Samsung's package is made by hand, and Android's only with its key.
      - name: Files built
        id: files
        if: inputs.unit != 'samsung' && (inputs.unit != 'android' || needs.android.outputs.signed == 'true')
        run: echo "any=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.files.outputs.any == 'true'
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        if: steps.files.outputs.any == 'true'
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # `gh attestation verify <file> --repo <owner>/<repo>` proves a file came from this workflow.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.files.outputs.any == 'true'
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.apk
            dist/*.aab
            dist/*.ipk
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
      - name: Notes
        env:
          SIGNED: ${{ needs.android.outputs.signed }}
        run: |
          bun scripts/release.mjs "$UNIT" notes "$VERSION" > notes.md
          if [ "$UNIT" = samsung ]; then
            printf '\n---\n\nThe Samsung package is signed with a Samsung certificate, so it is made by hand: `bun run --cwd apps/tizen package` (docs/TV_PLATFORMS.md).\n' >> notes.md
            echo "::notice::Samsung's package is made by hand: bun run --cwd apps/tizen package, then attach it to $TAG"
          fi
          if [ "$UNIT" = android ] && [ "$SIGNED" != true ]; then
            printf '\n---\n\nNo APK or Play bundle: the release key was not configured (docs/ANDROID.md, Releases).\n' >> notes.md
          fi
      # A re-run of a failed publish finds its tag on this commit and goes on.
      - name: Tag
        run: |
          on=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq "map(select(.ref == \"refs/tags/$TAG\")) | .[0].object.sha // \"\"")
          if [ -z "$on" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
            echo "Tagged $GITHUB_SHA as $TAG"
          elif [ "$on" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG exists already, on $on"
            exit 1
          fi
      # The repository's "Latest" release is the server's.
      - name: Release
        env:
          DRAFT: ${{ inputs.draft }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ ${#files[@]} -gt 0 ]; then gh release upload "$TAG" "${files[@]}" --clobber; fi
          else
            args=(--verify-tag --title "$TITLE $VERSION" --notes-file notes.md)
            if [ "$DRAFT" = true ]; then args+=(--draft); fi
            if [ "$UNIT" = server ]; then args+=(--latest); else args+=(--latest=false); fi
            gh release create "$TAG" "${files[@]}" "${args[@]}"
          fi
          echo "$TITLE $VERSION: $(gh release view "$TAG" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
