name: Repository

# What belongs to no single app: the workflows themselves, and the scripts
# that version and release the apps (docs/RELEASING.md), with every unit's
# manifests and CHANGELOG checked against each other.
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/**
      - scripts/version.mjs
      - scripts/changelog.mjs
      - scripts/release.mjs
      - scripts/release.test.mjs
      - "**/CHANGELOG.md"
  pull_request:
    paths:
      - .github/workflows/**
      - scripts/version.mjs
      - scripts/changelog.mjs
      - scripts/release.mjs
      - scripts/release.test.mjs
      - "**/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its running checks; master runs them all.
  group: repo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commits.
jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  versions:
    name: Versions and changelogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun test ./scripts
      - run: bun scripts/version.mjs check
      - run: bun scripts/release.mjs
