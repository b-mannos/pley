version: 2

# Weekly, grouped updates. A new release waits a few days before it is
# proposed, so a compromised or broken version has time to be pulled.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]

  # The Android app's libraries and plugins (gradle/libs.versions.toml).
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      androidx:
        patterns: ["androidx.*"]
        exclude-patterns: ["androidx.compose*", "androidx.media3*"]
        update-types: [minor, patch]
      compose:
        patterns: ["androidx.compose*"]
        update-types: [minor, patch]
      media3:
        patterns: ["androidx.media3*"]
        update-types: [minor, patch]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
        update-types: [minor, patch]
      square:
        patterns: ["com.squareup*"]
        update-types: [minor, patch]
      coil:
        patterns: ["io.coil-kt*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
