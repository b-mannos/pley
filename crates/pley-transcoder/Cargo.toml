[package]
name = "pley-transcoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "pley transcoder: FFmpeg-based media engine (probing, HLS transcoding, HDR/Dolby Vision tone mapping) for the pley media server"
license = "LicenseRef-Restricted"
publish = false

# This crate is intentionally self-contained (no workspace inheritance) so that
# it builds on its own.

[[bin]]
name = "pley-transcoder"
path = "src/main.rs"

[dependencies]
pley-transcoder-api = { path = "../pley-transcoder-api", version = "0.1" }

anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Ties ffmpeg's lifetime to the transcoder's (job object / parent-death signal).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
