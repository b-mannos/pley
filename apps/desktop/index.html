<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Pley</title>
  </head>
  <body>
    <main class="picker">
      <header class="brand">
        <svg viewBox="0 0 64 64" class="mark" aria-hidden="true">
          <defs>
            <linearGradient id="glyph" x1="12" y1="15" x2="34" y2="49" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#bae6fd" />
              <stop offset="1" stop-color="#38bdf8" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="#0a1622" />
          <path fill="#0c4a6e" d="M46 21.5h3a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3h-3z" />
          <path fill="#0284c7" d="M36 18.5h4.5a3.5 3.5 0 0 1 3.5 3.5v20a3.5 3.5 0 0 1-3.5 3.5H36z" />
          <path fill="url(#glyph)" fill-rule="evenodd" d="M16 15.5h14a4 4 0 0 1 4 4v25a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4v-25a4 4 0 0 1 4-4zM19 27v10a1 1 0 0 0 1.51.86l8.5-5a1 1 0 0 0 0-1.72l-8.5-5A1 1 0 0 0 19 27z" />
        </svg>
        <span class="wordmark">Pley</span>
      </header>

      <section id="connecting" class="connecting" hidden>
        <p class="connecting-text" id="connecting-text">Opening…</p>
        <button type="button" class="link" id="choose">Choose another server</button>
      </section>

      <section id="choose-section">
        <h1>Choose a server</h1>
        <ul class="servers" id="servers" aria-live="polite"></ul>
        <p class="status" id="status" role="status"></p>
        <button type="button" class="link" id="search-again" hidden>Search the network again</button>

        <form class="add" id="add" novalidate>
          <label for="address">Or enter its address</label>
          <div class="add-row">
            <input id="address" name="address" autocomplete="url" spellcheck="false" placeholder="nas, 192.168.1.20 or https://pley.example.com" />
            <button type="submit" class="primary" id="connect">Connect</button>
          </div>
          <p class="error" id="add-error" role="alert" hidden></p>
        </form>
      </section>

      <section id="downloads-section" class="downloads" hidden>
        <h2>Downloads</h2>
        <p class="hint">They play in your video player, even when the server is away.</p>
        <ul class="servers" id="downloads"></ul>
        <p class="status" id="downloads-status" role="status"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
