[package]
name = "pley-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "pley for Windows, macOS and Linux: a window on a pley server's web app"
license = "LicenseRef-Restricted"
publish = false

# A workspace of its own (see the root Cargo.toml): server builds and their
# CI don't compile Tauri and the webview libraries.
[workspace]

[lib]
name = "pley_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "macros"] }
if-addrs = "0.13"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["net", "time", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
